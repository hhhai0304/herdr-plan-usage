id = "hhhai0304.plan-usage"
name = "Plan Usage"
version = "1.0.0"
min_herdr_version = "0.9.0"  # popup panes + tab_bar_right command entries
description = "Usage meters of every agent signed in on this machine — tab bar line plus a detail popup. Detects Claude Code, Codex/ChatGPT, OpenCode Go, OpenRouter, DeepSeek and Antigravity; anything else through a custom command."
platforms = ["linux", "macos", "windows"]

# The tab bar line itself is a `ui.tab_bar_right` command entry in the user's config.toml
# (a manifest cannot declare tab bar entries). That entry runs <plugin config dir>/tab-bar.sh,
# a one-line shim this plugin keeps pointed at its current install: `setup` writes it and the
# startup hook rewrites it on every herdr start.

[[startup]]
command = ["python", "plan_usage.py", "shim"]

# Usage only moves while an agent works, so refresh when a turn ends (at most every 2 minutes).
[[events]]
on = "pane.agent_status_changed"
command = ["python", "plan_usage.py", "event"]

[[panes]]
id = "panel"
title = "Plan Usage"
placement = "popup"
width = 76
height = 24
command = ["python", "plan_usage.py", "panel"]

[[panes]]
id = "setup"
title = "Plan Usage setup"
placement = "popup"
width = "92%"
height = 16
command = ["python", "plan_usage.py", "setup"]

[[actions]]
id = "open"
title = "Show plan usage"
command = ["python", "plan_usage.py", "open"]

[[actions]]
id = "setup"
title = "Choose which agents the tab bar shows"
command = ["python", "plan_usage.py", "open", "setup"]

[[actions]]
id = "refresh"
title = "Refresh plan usage now"
command = ["python", "plan_usage.py", "refresh"]
